<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <linearGradient id="flow-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="flow-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>
    <linearGradient id="flow-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="flow-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="box-shadow" x="-3%" y="-3%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.1" />
    </filter>
  </defs>

  <rect width="960" height="520" fill="#ffffff" rx="10" stroke="#e2e8f0" stroke-width="2" />

  <!-- Title -->
  <text x="480" y="36" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="800" text-anchor="middle" fill="#0f172a">CAMERA-TO-SPEECH PROCESSING PIPELINE (END-TO-END)</text>
  <text x="480" y="56" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" text-anchor="middle" fill="#64748b">Asynchronous Vision Extraction, Neural Classification, Streak Debouncing, and Causal Translation</text>

  <!-- Step 1: Camera Ingress -->
  <g transform="translate(30, 80)">
    <rect width="160" height="90" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5" rx="6" filter="url(#box-shadow)" />
    <rect width="160" height="24" fill="url(#flow-cyan)" rx="6" />
    <rect y="18" width="160" height="6" fill="url(#flow-cyan)" />
    <text x="80" y="16" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">1. WEBCAM INGRESS</text>
    <text x="12" y="44" font-family="sans-serif" font-size="10" font-weight="600" fill="#0369a1">• HTML5 Canvas (30 FPS)</text>
    <text x="12" y="60" font-family="sans-serif" font-size="10" fill="#475569">• JPEG Binary Encoding</text>
    <text x="12" y="76" font-family="sans-serif" font-size="10" fill="#475569">• WS Backpressure Guard</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g transform="translate(195, 125)">
    <line x1="0" y1="0" x2="25" y2="0" stroke="#0284c7" stroke-width="2" />
    <polygon points="25,0 19,-4 19,4" fill="#0284c7" />
  </g>

  <!-- Step 2: MediaPipe Holistic -->
  <g transform="translate(225, 80)">
    <rect width="165" height="90" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5" rx="6" filter="url(#box-shadow)" />
    <rect width="165" height="24" fill="url(#flow-indigo)" rx="6" />
    <rect y="18" width="165" height="6" fill="url(#flow-indigo)" />
    <text x="82" y="16" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">2. MEDIAPIPE TRACKER</text>
    <text x="12" y="44" font-family="sans-serif" font-size="10" font-weight="600" fill="#4338ca">• Hands: 21x3 coords each</text>
    <text x="12" y="60" font-family="sans-serif" font-size="10" fill="#475569">• Pose: 33 body keypoints</text>
    <text x="12" y="76" font-family="sans-serif" font-size="10" fill="#475569">• Face Mesh (468 keypoints)</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g transform="translate(395, 125)">
    <line x1="0" y1="0" x2="25" y2="0" stroke="#4f46e5" stroke-width="2" />
    <polygon points="25,0 19,-4 19,4" fill="#4f46e5" />
  </g>

  <!-- Step 3: Spatial Feature Normalization -->
  <g transform="translate(425, 80)">
    <rect width="170" height="90" fill="#fefce8" stroke="#fef08a" stroke-width="1.5" rx="6" filter="url(#box-shadow)" />
    <rect width="170" height="24" fill="url(#flow-amber)" rx="6" />
    <rect y="18" width="170" height="6" fill="url(#flow-amber)" />
    <text x="85" y="16" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">3. FEATURE EXTRACTION</text>
    <text x="12" y="44" font-family="sans-serif" font-size="10" font-weight="600" fill="#b45309">• Wrist Translation: p' = p - p0</text>
    <text x="12" y="60" font-family="sans-serif" font-size="10" fill="#475569">• Palm Scale: d = ||p9 - p0||</text>
    <text x="12" y="76" font-family="sans-serif" font-size="10" fill="#475569">• 3D In/Out-of-Plane Rotation</text>
  </g>

  <!-- Split to Step 4A and 4B -->
  <path d="M 600,125 L 630,125 L 630,110 L 650,110" fill="none" stroke="#64748b" stroke-width="1.5" />
  <polygon points="650,110 644,107 644,113" fill="#64748b" />
  
  <path d="M 600,125 L 630,125 L 630,220 L 650,220" fill="none" stroke="#64748b" stroke-width="1.5" />
  <polygon points="650,220 644,217 644,223" fill="#64748b" />

  <!-- Step 4A: RealSign Neural Inference -->
  <g transform="translate(655, 65)">
    <rect width="270" height="100" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" rx="6" filter="url(#box-shadow)" />
    <rect width="270" height="24" fill="url(#flow-emerald)" rx="6" />
    <rect y="18" width="270" height="6" fill="url(#flow-emerald)" />
    <text x="135" y="16" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">4A. REALSIGN MLP (126-D)</text>
    <text x="12" y="44" font-family="sans-serif" font-size="10" font-weight="600" fill="#15803d">• Checkpoint Test Accuracy: 94.99%</text>
    <text x="12" y="60" font-family="sans-serif" font-size="10" fill="#475569">• Softmax Temperature Scaling (T=0.75)</text>
    <text x="12" y="74" font-family="sans-serif" font-size="10" fill="#475569">• Left-Hand Symmetry Mirroring (x -> -x)</text>
    <text x="12" y="88" font-family="sans-serif" font-size="10" font-weight="700" fill="#047857">• Neuro-Symbolic Heuristic Tie-Breaker</text>
  </g>

  <!-- Step 4B: Asynchronous Object Detector -->
  <g transform="translate(655, 185)">
    <rect width="270" height="75" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" rx="6" filter="url(#box-shadow)" />
    <rect width="270" height="22" fill="#475569" rx="6" />
    <rect y="16" width="270" height="6" fill="#475569" />
    <text x="135" y="15" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">4B. YOLO-WORLD V2 (ASYNC WORKER)</text>
    <text x="12" y="40" font-family="sans-serif" font-size="10" font-weight="600" fill="#334155">• Open-Vocabulary Held Object Grounding</text>
    <text x="12" y="55" font-family="sans-serif" font-size="10" fill="#64748b">• Non-blocking thread (runs every 6 frames)</text>
    <text x="12" y="68" font-family="sans-serif" font-size="10" fill="#64748b">• Wristband Filter: threshold >= 0.58 for watch</text>
  </g>

  <!-- Convergence to Step 5: Debouncing & Accumulator -->
  <path d="M 790,170 L 790,290 L 515,290" fill="none" stroke="#059669" stroke-width="2" />
  <path d="M 790,265 L 790,290" fill="none" stroke="#475569" stroke-width="1.5" />
  <polygon points="515,290 523,286 523,294" fill="#059669" />

  <!-- Step 5: Temporal Debouncing & Sentence Accumulator -->
  <g transform="translate(230, 310)">
    <rect width="280" height="110" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="6" filter="url(#box-shadow)" />
    <rect width="280" height="24" fill="url(#flow-indigo)" rx="6" />
    <rect y="18" width="280" height="6" fill="url(#flow-indigo)" />
    <text x="140" y="16" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">5. TEMPORAL DEBOUNCER &amp; ACCUMULATOR</text>
    <text x="12" y="44" font-family="sans-serif" font-size="10" font-weight="600" fill="#3730a3">• Required Streak: 3-4 consecutive frames</text>
    <text x="12" y="60" font-family="sans-serif" font-size="10" fill="#475569">• Confidence Hysteresis: P(c) >= threshold &amp;&amp; margin >= 0.05</text>
    <text x="12" y="76" font-family="sans-serif" font-size="10" fill="#475569">• Word Timeout Buffer (1.2s idle commit)</text>
    <text x="12" y="92" font-family="sans-serif" font-size="10" fill="#475569">• Sentence Boundary (2.5s sentence timeout)</text>
  </g>

  <!-- Arrow 5 -> 6 -->
  <g transform="translate(225, 365)">
    <line x1="0" y1="0" x2="-30" y2="0" stroke="#4f46e5" stroke-width="2" />
    <polygon points="-30,0 -24,-4 -24,4" fill="#4f46e5" />
  </g>

  <!-- Step 6: Neural ISL-to-English Translation -->
  <g transform="translate(30, 310)">
    <rect width="160" height="110" fill="#fdf4ff" stroke="#f0abfc" stroke-width="1.5" rx="6" filter="url(#box-shadow)" />
    <rect width="160" height="24" fill="#c026d3" rx="6" />
    <rect y="18" width="160" height="6" fill="#c026d3" />
    <text x="80" y="16" font-family="sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">6. QWEN2.5-0.5B (CAUSAL LM)</text>
    <text x="10" y="44" font-family="sans-serif" font-size="10" font-weight="600" fill="#86198f">• Decoder-Only Causal LM</text>
    <text x="10" y="60" font-family="sans-serif" font-size="10" fill="#475569">• ChatML Few-Shot Prompt</text>
    <text x="10" y="76" font-family="sans-serif" font-size="10" fill="#475569">• ISL SOV -> English SVO</text>
    <text x="10" y="92" font-family="sans-serif" font-size="10" fill="#475569">• Greedy generation (&lt;36 tok)</text>
  </g>

  <!-- Arrow 6 -> 7 -->
  <path d="M 110,425 L 110,455 L 225,455" fill="none" stroke="#c026d3" stroke-width="2" />
  <polygon points="225,455 219,451 219,459" fill="#c026d3" />

  <!-- Step 7: Egress & TTS -->
  <g transform="translate(230, 435)">
    <rect width="695" height="65" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" rx="6" filter="url(#box-shadow)" />
    <rect width="140" height="65" fill="url(#flow-emerald)" rx="6" />
    <text x="70" y="28" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">7. CLIENT EGRESS</text>
    <text x="70" y="46" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">&amp; SPEECH SYNTHESIS</text>

    <text x="160" y="26" font-family="sans-serif" font-size="11" font-weight="600" fill="#166534">• WebSocket JSON Packet: label, confidence, candidates, sentence_buffer, translated_text, detected_objects</text>
    <text x="160" y="48" font-family="sans-serif" font-size="11" fill="#475569">• React UI updates live captions, bounding boxes, and triggers Browser Web Speech API (Auto-Speak)</text>
  </g>
</svg>

