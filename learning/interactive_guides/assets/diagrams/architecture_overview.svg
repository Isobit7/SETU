<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="grad-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#5b21b6" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="960" height="480" fill="#f8fafc" rx="12" />
  <rect x="10" y="10" width="940" height="460" fill="none" stroke="#e2e8f0" stroke-width="2" rx="8" />

  <!-- Title Banner -->
  <text x="480" y="42" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="800" text-anchor="middle" fill="#0f172a">PROJECT SETU — SYSTEM ARCHITECTURE OVERVIEW</text>
  <text x="480" y="64" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" text-anchor="middle" fill="#64748b">Real-Time Indian Sign Language Translation &amp; Multimodal AI Engine</text>

  <!-- Layer 1: Client Presentation Tier -->
  <g transform="translate(40, 90)">
    <rect width="250" height="340" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="8" filter="url(#shadow)" />
    <rect width="250" height="38" fill="url(#grad-blue)" rx="8" />
    <rect y="30" width="250" height="8" fill="url(#grad-blue)" />
    <text x="125" y="24" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">CLIENT PRESENTATION TIER</text>
    
    <!-- React Component Blocks -->
    <rect x="15" y="55" width="220" height="50" fill="#eff6ff" stroke="#bfdbfe" rx="6" />
    <text x="25" y="75" font-family="sans-serif" font-size="12" font-weight="700" fill="#1e40af">React 19 + TypeScript SPA</text>
    <text x="25" y="93" font-family="sans-serif" font-size="10" fill="#3b82f6">Vite 6 Bundler (Port 5173)</text>

    <rect x="15" y="115" width="220" height="55" fill="#f8fafc" stroke="#e2e8f0" rx="6" />
    <text x="25" y="135" font-family="sans-serif" font-size="11" font-weight="600" fill="#334155">CameraWorkspace &amp; Canvas</text>
    <text x="25" y="152" font-family="sans-serif" font-size="10" fill="#64748b">Webcam Ingress @ 30 FPS</text>

    <rect x="15" y="180" width="220" height="55" fill="#f8fafc" stroke="#e2e8f0" rx="6" />
    <text x="25" y="200" font-family="sans-serif" font-size="11" font-weight="600" fill="#334155">useRecognitionStream Hook</text>
    <text x="25" y="217" font-family="sans-serif" font-size="10" fill="#64748b">Binary WebSocket Frame Sender</text>

    <rect x="15" y="245" width="220" height="75" fill="#f8fafc" stroke="#e2e8f0" rx="6" />
    <text x="25" y="265" font-family="sans-serif" font-size="11" font-weight="600" fill="#334155">Multimodal HUD &amp; TTS</text>
    <text x="25" y="282" font-family="sans-serif" font-size="10" fill="#64748b">• Web Speech API Synthesizer</text>
    <text x="25" y="298" font-family="sans-serif" font-size="10" fill="#64748b">• Disambiguation &amp; Framing Guide</text>
  </g>

  <!-- Arrow 1: Client to Backend -->
  <g transform="translate(295, 250)">
    <line x1="0" y1="0" x2="50" y2="0" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="4,4" />
    <polygon points="50,0 42,-5 42,5" fill="#2563eb" />
    <text x="25" y="-10" font-family="monospace" font-size="9" font-weight="700" fill="#2563eb" text-anchor="middle">WS /ws/recognize</text>
    <text x="25" y="15" font-family="monospace" font-size="9" fill="#64748b" text-anchor="middle">JPEG Bytes</text>
  </g>

  <!-- Layer 2: API Gateway Tier -->
  <g transform="translate(355, 90)">
    <rect width="250" height="340" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="8" filter="url(#shadow)" />
    <rect width="250" height="38" fill="url(#grad-indigo)" rx="8" />
    <rect y="30" width="250" height="8" fill="url(#grad-indigo)" />
    <text x="125" y="24" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">GATEWAY &amp; SERVICE TIER</text>

    <rect x="15" y="55" width="220" height="50" fill="#eef2ff" stroke="#c7d2fe" rx="6" />
    <text x="25" y="75" font-family="sans-serif" font-size="12" font-weight="700" fill="#3730a3">FastAPI ASGI Engine</text>
    <text x="25" y="93" font-family="sans-serif" font-size="10" fill="#4f46e5">Uvicorn Server (Port 8000)</text>

    <rect x="15" y="115" width="220" height="55" fill="#f8fafc" stroke="#e2e8f0" rx="6" />
    <text x="25" y="135" font-family="sans-serif" font-size="11" font-weight="600" fill="#334155">WebSocket Stream Handler</text>
    <text x="25" y="152" font-family="sans-serif" font-size="10" fill="#64748b">Backpressure Guard &amp; Decoding</text>

    <rect x="15" y="180" width="220" height="55" fill="#f8fafc" stroke="#e2e8f0" rx="6" />
    <text x="25" y="200" font-family="sans-serif" font-size="11" font-weight="600" fill="#334155">REST Routing (17 URLs)</text>
    <text x="25" y="217" font-family="sans-serif" font-size="10" fill="#64748b">Health, Models, Video, Datasets</text>

    <rect x="15" y="245" width="220" height="75" fill="#f8fafc" stroke="#e2e8f0" rx="6" />
    <text x="25" y="265" font-family="sans-serif" font-size="11" font-weight="600" fill="#334155">SentenceAccumulator</text>
    <text x="25" y="282" font-family="sans-serif" font-size="10" fill="#64748b">• Streak Debouncing (3-4 frames)</text>
    <text x="25" y="298" font-family="sans-serif" font-size="10" fill="#64748b">• Word/Sentence Timeout Buffers</text>
  </g>

  <!-- Arrow 2: Backend to Inference -->
  <g transform="translate(610, 250)">
    <line x1="0" y1="0" x2="50" y2="0" stroke="#4f46e5" stroke-width="2.5" />
    <polygon points="50,0 42,-5 42,5" fill="#4f46e5" />
    <text x="25" y="-10" font-family="monospace" font-size="9" font-weight="700" fill="#4f46e5" text-anchor="middle">In-Process</text>
    <text x="25" y="15" font-family="monospace" font-size="9" fill="#64748b" text-anchor="middle">Zero-Copy</text>
  </g>

  <!-- Layer 3: AI/ML Inference Tier -->
  <g transform="translate(670, 90)">
    <rect width="250" height="340" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="8" filter="url(#shadow)" />
    <rect width="250" height="38" fill="url(#grad-emerald)" rx="8" />
    <rect y="30" width="250" height="8" fill="url(#grad-emerald)" />
    <text x="125" y="24" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">ML INFERENCE &amp; VISION</text>

    <rect x="15" y="55" width="220" height="50" fill="#f0fdf4" stroke="#bbf7d0" rx="6" />
    <text x="25" y="75" font-family="sans-serif" font-size="11" font-weight="700" fill="#166534">MediaPipe Holistic</text>
    <text x="25" y="93" font-family="sans-serif" font-size="10" fill="#15803d">Hands (21x3), Pose (33x3), Face</text>

    <rect x="15" y="115" width="220" height="55" fill="#f8fafc" stroke="#e2e8f0" rx="6" />
    <text x="25" y="133" font-family="sans-serif" font-size="11" font-weight="600" fill="#334155">RealSign 26-Class MLP</text>
    <text x="25" y="150" font-family="sans-serif" font-size="10" fill="#64748b">126-D Wrist Norm + Geometric Boost</text>
    <text x="25" y="162" font-family="sans-serif" font-size="9" font-weight="700" fill="#059669">Reported Test Acc: 94.99%</text>

    <rect x="15" y="180" width="220" height="55" fill="#f8fafc" stroke="#e2e8f0" rx="6" />
    <text x="25" y="198" font-family="sans-serif" font-size="11" font-weight="600" fill="#334155">ISL Sequence BiLSTM</text>
    <text x="25" y="215" font-family="sans-serif" font-size="10" fill="#64748b">30-Frame Window, 328-D Features</text>
    <text x="25" y="227" font-family="sans-serif" font-size="9" fill="#059669">7 Conversational Classes</text>

    <rect x="15" y="245" width="220" height="75" fill="#f8fafc" stroke="#e2e8f0" rx="6" />
    <text x="25" y="263" font-family="sans-serif" font-size="11" font-weight="600" fill="#334155">Multimodal Helpers</text>
    <text x="25" y="280" font-family="sans-serif" font-size="10" fill="#64748b">• YOLO-World v2 (Held Objects)</text>
    <text x="25" y="296" font-family="sans-serif" font-size="10" fill="#64748b">• Qwen2.5-0.5B (Causal LM Translation)</text>
    <text x="25" y="310" font-family="sans-serif" font-size="10" fill="#64748b">• AI4Bharat INCLUDE (263 Signs)</text>
  </g>
</svg>

